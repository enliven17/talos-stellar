# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  # Secret scan on staged changes (fail-closed, local check)
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan
        entry: bash scripts/secret-scan.sh
        language: system
        always_run: true
        pass_filenames: false

  # Python linting and formatting for prime-agent and openclaw
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        name: ruff
        files: ^packages/(prime-agent|openclaw)/
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        name: ruff format
        files: ^packages/(prime-agent|openclaw)/
        types_or: [python, pyi]

  # ESLint for web and sdk
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm lint
        language: system
        files: ^(web|packages/sdk)/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

  # Cargo fmt check for contracts
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check --manifest-path contracts/Cargo.toml --all
        language: system
        files: ^contracts/
        types: [rust]
        pass_filenames: false
