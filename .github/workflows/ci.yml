name: CI — Changed-Path Package Matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Detect which packages were affected by changed files.
  # Outputs a JSON matrix consumed by the downstream job.
  # ─────────────────────────────────────────────────────────────────
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Guard: run the detector's own test suite before it gates CI.
      #    A broken detector must never silently skip package checks.
      - name: Self-test detection script
        run: bash scripts/ci-detect-changes.test.sh

      # ── Shared env for the detect step. These are workflow-controlled
      #    values, not user input; the script additionally validates them
      #    (format + object existence) before use, and never echoes them.
      - name: Detect changed packages
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # ── Determine base/head SHAs ────────────────────────────
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # push events diff against the previous push. The detection
            # script degrades to ALL when the base object is missing
            # (e.g. force push or a new branch's first push).
            BASE_SHA="${PUSH_BEFORE_SHA}"
            HEAD_SHA="${PUSH_HEAD_SHA}"
          else
            # workflow_dispatch / unknown events — run all packages via
            # the script's --all mode (single source of truth).
            MATRIX=$(bash scripts/ci-detect-changes.sh --all)
            echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Run the detection script ────────────────────────────
          # The script always exits 0 and prints a usable matrix
          # (normal, degraded-to-ALL, or empty); failure semantics are
          # fail-closed, never skip-silently. It validates the SHAs
          # before use and redacts input values from its diagnostics.
          MATRIX=$(bash scripts/ci-detect-changes.sh "$BASE_SHA" "$HEAD_SHA")
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Run checks for each affected package.
  # Skipped entirely when the matrix is empty (no source changes).
  # ─────────────────────────────────────────────────────────────────
  package-check:
    name: "check · ${{ matrix.package }}"
    needs: detect
    if: needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      max-parallel: 4

    steps:
      - uses: actions/checkout@v4

      # ── Shared toolchain setup (only installs what the matrix package needs) ──

      - name: Setup pnpm
        if: matrix.package == 'web' || matrix.package == 'sdk'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: matrix.package == 'web' || matrix.package == 'sdk'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager: pnpm

      - name: Install JS/TS dependencies
        if: matrix.package == 'web' || matrix.package == 'sdk'
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        if: matrix.package == 'prime-agent'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        if: matrix.package == 'prime-agent'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/prime-agent/uv.lock

      - name: Install Python dependencies
        if: matrix.package == 'prime-agent'
        run: uv sync --frozen --all-extras --all-groups
        working-directory: packages/prime-agent

      - name: Setup Rust toolchain
        if: matrix.package == 'contracts'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ── Contract artifact cache (#635) ─────────────────────────────────
      # Caches contracts/target/wasm32-unknown-unknown/release (the wasm
      # build output) keyed by OS + rustc fingerprint + strong content
      # hash of the contract build inputs from scripts/ci-contract-cache.sh
      # key-hash. Any input change → new key → miss → rebuild; restore-keys
      # only prefix-match the same OS+toolchain. Corrupt entries are wiped
      # and rebuilt (never fail the job); flaky restore/save steps are
      # non-fatal (continue-on-error + warning); missing key inputs and
      # missing/invalid artifacts fail closed with an explicit ::error::.
      # The wasm build always runs, so stale artifacts are never consumed.
      # Only the build output directory is cached — no secrets or configs.
      #
      # Local reproduction:
      #   bash scripts/ci-contract-cache.test.sh
      - name: "[contracts] Compute cache key"
        if: matrix.package == 'contracts'
        id: cache-key
        run: |
          HASH=$(bash scripts/ci-contract-cache.sh key-hash contracts)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(rustc --version | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: "[contracts] Restore artifact cache"
        if: matrix.package == 'contracts'
        id: cache-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: contracts/target/wasm32-unknown-unknown/release
          key: ${{ runner.os }}-contracts-wasm-${{ steps.cache-key.outputs.toolchain }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-contracts-wasm-${{ steps.cache-key.outputs.toolchain }}-

      - name: "[contracts] Warn on cache restore failure"
        if: matrix.package == 'contracts' && steps.cache-restore.outcome == 'failure'
        run: echo "::warning::Contract artifact cache restore failed (flaky step or backend error) — continuing with a full rebuild. The cache is an optimization only; artifacts are always built and verified in this job."

      - name: "[contracts] Validate restored artifacts"
        if: matrix.package == 'contracts'
        run: bash scripts/ci-contract-cache.sh validate contracts/target/wasm32-unknown-unknown/release

      # ── Per-package checks ──────────────────────────────────────

      # ── Web: typecheck, lint, unit tests ────────────────────────
      - name: "[web] Type check"
        if: matrix.package == 'web'
        working-directory: web
        run: npx tsc --noEmit

      - name: "[web] Lint"
        if: matrix.package == 'web'
        working-directory: web
        run: pnpm lint

      - name: "[web] Unit tests"
        if: matrix.package == 'web'
        working-directory: web
        run: pnpm test:unit

      # ── SDK: build/typecheck, tests ─────────────────────────────
      - name: "[sdk] Build & typecheck"
        if: matrix.package == 'sdk'
        working-directory: packages/sdk
        run: pnpm run build

      - name: "[sdk] Tests"
        if: matrix.package == 'sdk'
        working-directory: packages/sdk
        run: pnpm run test

      # ── Prime Agent: ruff, pytest ───────────────────────────────
      - name: "[prime-agent] Lint"
        if: matrix.package == 'prime-agent'
        working-directory: packages/prime-agent
        run: uv run ruff check src tests

      - name: "[prime-agent] Test"
        if: matrix.package == 'prime-agent'
        working-directory: packages/prime-agent
        run: uv run pytest tests/ -v

      # ── Contracts: cargo test, WASM build ───────────────────────
      - name: "[contracts] Test"
        if: matrix.package == 'contracts'
        working-directory: contracts
        run: cargo test

      - name: "[contracts] WASM build"
        if: matrix.package == 'contracts'
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: "[contracts] Verify artifacts"
        if: matrix.package == 'contracts'
        run: bash scripts/ci-contract-cache.sh verify contracts/target/wasm32-unknown-unknown/release

      - name: "[contracts] Save artifact cache"
        if: matrix.package == 'contracts' && steps.cache-restore.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: contracts/target/wasm32-unknown-unknown/release
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
