name: Benchmark CI — regression gates

on:
  push:
    branches: [main]
    paths:
      - "web/src/**"
      - "packages/sdk/src/**"
  pull_request:
    branches: [main]
    paths:
      - "web/src/**"
      - "packages/sdk/src/**"

jobs:
  benchmark:
    name: Run performance benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark unit tests
        run: pnpm test:bench
        working-directory: web

      - name: Run API route benchmarks
        run: pnpm bench:suite api
        working-directory: web
        env:
          BENCHMARK_RUNS: 20
          BENCHMARK_WARMUP_RUNS: 3
          BENCHMARK_VARIANCE_THRESHOLD: 0.25
          BENCHMARK_MEMORY_THRESHOLD_MB: 1024
          BENCHMARK_CPU_THRESHOLD_PCT: 90
          CI: true

      - name: Run scheduler loop benchmarks
        run: pnpm bench:suite scheduler
        working-directory: web
        env:
          BENCHMARK_RUNS: 20
          BENCHMARK_WARMUP_RUNS: 3
          CI: true

      - name: Run SDK call benchmarks
        run: pnpm bench:suite sdk
        working-directory: web
        env:
          BENCHMARK_RUNS: 20
          BENCHMARK_WARMUP_RUNS: 3
          CI: true

      - name: Run contract workflow benchmarks
        run: pnpm bench:suite contract
        working-directory: web
        env:
          BENCHMARK_RUNS: 20
          BENCHMARK_WARMUP_RUNS: 3
          CI: true

      - name: Archive benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: .benchmarks/
          retention-days: 30