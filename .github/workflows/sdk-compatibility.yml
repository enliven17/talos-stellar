name: SDK Compatibility Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-sdk:
    name: Build SDK (ESM + CJS + browser bundle)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Get pnpm store path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-sdk-build-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-sdk-build-${{ matrix.node-version }}-
      - name: Install workspace dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            (cd packages/sdk && npm ci || npm install)
          else
            (cd packages/sdk && npm install)
          fi
      - name: Build SDK (all formats)
        shell: bash
        run: |
          if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
            pnpm --filter @talos-protocol/sdk build
          else
            (cd packages/sdk && npm run build)
          fi
      - name: Upload SDK dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-node-${{ matrix.node-version }}
          path: packages/sdk/dist/
          retention-days: 1

  unit-tests:
    name: SDK Unit Tests (Vitest / Node ${{ matrix.node-version }})
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Get pnpm store path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-sdk-test-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-sdk-test-${{ matrix.node-version }}-
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            (cd packages/sdk && npm ci || npm install)
          else
            (cd packages/sdk && npm install)
          fi
      - name: Run unit tests (Vitest / Node)
        shell: bash
        run: |
          if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
            pnpm --filter @talos-protocol/sdk test
          else
            (cd packages/sdk && npm test)
          fi

  node-esm:
    name: Node ESM import (Node ${{ matrix.node-version }})
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download SDK dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist-node-${{ matrix.node-version }}
          path: packages/sdk/dist
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install runtime dependencies (for stellar-sdk)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            (cd packages/sdk && npm ci --omit=dev || npm install --omit=dev || npm install)
          else
            (cd packages/sdk && npm install --omit=dev || npm install)
          fi
      - name: Run Node ESM smoke import test
        shell: bash
        run: |
          if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
            pnpm --filter @talos-protocol/sdk compat:node-esm
          else
            (cd packages/sdk && npm run compat:node-esm)
          fi

  node-cjs:
    name: Node CJS require (Node ${{ matrix.node-version }})
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download SDK dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist-node-${{ matrix.node-version }}
          path: packages/sdk/dist
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install runtime dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            (cd packages/sdk && npm ci --omit=dev || npm install --omit=dev || npm install)
          else
            (cd packages/sdk && npm install --omit=dev || npm install)
          fi
      - name: Run Node CJS require() smoke test
        shell: bash
        run: |
          if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
            pnpm --filter @talos-protocol/sdk compat:node-cjs
          else
            (cd packages/sdk && npm run compat:node-cjs)
          fi

  browser-bundle:
    name: Browser bundle (build + vm sandboxed load)
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download SDK dist (includes browser bundle)
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist-node-20.x
          path: packages/sdk/dist
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install runtime dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            (cd packages/sdk && npm ci --omit=dev || npm install --omit=dev || npm install)
          else
            (cd packages/sdk && npm install --omit=dev || npm install)
          fi
      - name: Verify browser bundle was produced
        shell: bash
        run: |
          test -f packages/sdk/dist/browser/sdk.bundle.js || {
            echo "Browser bundle not built — re-running build step explicitly"
            if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
              pnpm --filter @talos-protocol/sdk build:browser
            else
              (cd packages/sdk && npm run build:browser)
            fi
          }
          test -s packages/sdk/dist/browser/sdk.bundle.js
          echo "Bundle exists, size: $(wc -c < packages/sdk/dist/browser/sdk.bundle.js)"
      - name: Run browser-bundle sandbox smoke test
        shell: bash
        run: |
          if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
            pnpm --filter @talos-protocol/sdk compat:browser-bundle
          else
            (cd packages/sdk && npm run compat:browser-bundle)
          fi

  edge-runtime:
    name: Edge runtime import (Node ${{ matrix.node-version }} VM sandbox)
    needs: build-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download SDK ESM dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist-node-20.x
          path: packages/sdk/dist
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install runtime dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            (cd packages/sdk && npm ci --omit=dev || npm install --omit=dev || npm install)
          else
            (cd packages/sdk && npm install --omit=dev || npm install)
          fi
      - name: Run edge-runtime sandbox smoke test
        shell: bash
        run: |
          if [ -f pnpm-workspace.yaml ] && command -v pnpm >/dev/null 2>&1; then
            pnpm --filter @talos-protocol/sdk compat:edge
          else
            (cd packages/sdk && npm run compat:edge)
          fi
