name: Prime Agent CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/prime-agent/**'
      - '.github/workflows/ci-prime-agent.yml'
  push:
    branches: [main]
    paths:
      - 'packages/prime-agent/**'
      - '.github/workflows/ci-prime-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/prime-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/prime-agent/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest tests/ -v --cov --cov-report=json --cov-report=term

      # Per-module floors for critical agent modules (issue #638). Reads the
      # JSON report produced above; thresholds live in the script's
      # COVERAGE_FLOORS table (single source of truth).
      - name: Coverage gate
        run: uv run python scripts/check-coverage.py coverage.json

      # Per-function p99 latency ceilings for synchronous hot paths (issue #645).
      # Thresholds live in scripts/check-perf-budget.py PERF_BUDGET table
      # (single source of truth). Uses --samples 50 --warmup 5 for a fast but
      # meaningful CI pass; run locally with --samples 500 for higher precision.
      # Fails closed: any p99 that exceeds its ceiling causes the step to fail.
      - name: Performance budget gate
        run: uv run python scripts/check-perf-budget.py --samples 50 --warmup 5 --quiet
        env:
          # Disable OTEL/Sentry so the perf budget measures pure hot-path code
          # without any telemetry side effects.
          OTEL_ENABLED: "false"
          SENTRY_DSN: ""
